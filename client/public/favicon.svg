<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Яркий фиолетовый градиент корпуса (контрастен к белой и темной теме) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Зеленый градиент для колесика -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Свечение вокруг мыши -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- 1. Внешняя контрастная белая обводка (для видимости на ТЁМНЫХ вкладках) -->
    <rect x="138" y="90" width="236" height="332" rx="118" fill="none" stroke="#ffffff" stroke-width="10"/>

    <!-- 2. Яркий фиолетовый корпус мыши (отлично виден на СВЕТЛЫХ и ТЁМНЫХ вкладках) -->
    <rect x="144" y="96" width="224" height="320" rx="112" fill="url(#bodyGrad)"/>

    <!-- Разделительная линия клавиш ЛКМ / ПКМ -->
    <line x1="256" y1="100" x2="256" y2="210" stroke="#818cf8" stroke-width="4" stroke-dasharray="6 4"/>

    <!-- Изумрудно-зеленое колесико (Scroll Encoder) -->
    <rect x="240" y="140" width="32" height="64" rx="16" fill="url(#accentGrad)" stroke="#059669" stroke-width="2"/>
    <line x1="248" y1="160" x2="264" y2="160" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="248" y1="172" x2="264" y2="172" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="248" y1="184" x2="264" y2="184" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Зеленая молния (Double Click Test) -->
    <path d="M268 280 L236 330 H260 L244 376 L288 320 H264 Z" fill="#34d399"/>
  </g>
</svg>
